# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.dev.yml  —  Infrastructure only (PostgreSQL + Redis in Docker)
# Run backend and frontend locally with hot-reload as you normally do.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   # then in separate terminals:
#   ./mvnw spring-boot:run          (backend with SSL as before)
#   cd src/frontend && npm run dev  (frontend with Vite hot-reload)
# ─────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       smilingwallet
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smilingwallet"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_dev_data:
