# ─────────────────────────────────────────────────────────────────────────────
# EXAMPLE ONLY — do NOT apply this file directly.
# Values must be base64-encoded. Encode with:
#   echo -n "your_value_here" | base64
#
# Apply real secrets with:
#   kubectl create secret generic smiling-wallet-secrets \
#     --namespace smiling-wallet \
#     --from-literal=db-password='your_password' \
#     --from-literal=jwt-secret='your_jwt_secret' \
#     --from-literal=totp-key='your_totp_key' \
#     --from-literal=mail-username='your@email.com' \
#     --from-literal=mail-password='your_app_password'
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: smiling-wallet-secrets
  namespace: smiling-wallet
type: Opaque
data:
  db-password:    <base64_encoded_value>
  jwt-secret:     <base64_encoded_value>
  totp-key:       <base64_encoded_value>
  mail-username:  <base64_encoded_value>
  mail-password:  <base64_encoded_value>
