apiVersion: v1
kind: ConfigMap
metadata:
  name: smiling-wallet-config
  namespace: smiling-wallet
data:
  # Spring Boot profile activates application-docker.yml overrides
  SPRING_PROFILES_ACTIVE: "docker"

  # Database connection (host = postgres Service name)
  SPRING_DATASOURCE_URL:      "jdbc:postgresql://postgres-service:5432/smilingwallet"
  SPRING_DATASOURCE_USERNAME: "postgres"

  # Redis connection (host = redis Service name)
  SPRING_REDIS_HOST: "redis-service"
  SPRING_REDIS_PORT: "6379"

  # CORS — set to your actual domain in production, e.g. "https://your-domain.com"
  CORS_ALLOWED_ORIGINS: "http://your-domain.com,https://your-domain.com"
