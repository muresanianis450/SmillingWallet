version: '3.9'

# ─── Local full-stack test ────────────────────────────────────────────────────
# Usage:
#   cp .env.example .env          # fill in secrets
#   docker compose up --build
#   Open http://localhost
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       smilingwallet
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Spring Boot backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Database (matches the postgres service above)
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/smilingwallet
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Redis (matches the redis service above)
      REDIS_URL: redis://redis:6379
      # Secrets — override via .env file or shell env
      JWT_SECRET:              ${JWT_SECRET:-ThisIsAVeryLongSecretKeyForSmilingWalletThatIsAtLeast256BitsLongAndShouldBeEvenLongerForBetterSecurity1234567890ABCDEF}
      MAIL_USERNAME:           ${MAIL_USERNAME:-}
      MAIL_PASSWORD:           ${MAIL_PASSWORD:-}
      APP_TOTP_ENCRYPTION_KEY: ${APP_TOTP_ENCRYPTION_KEY:-SmilingWalletTotpDevKey-ChangeInProd!}
      # CORS: allow requests from the nginx frontend (port 80)
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── React frontend (nginx) ───────────────────────────────────────────────────
  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # nginx.conf.template substitutes this for proxy_pass targets
      BACKEND_URL: http://backend:8080

volumes:
  postgres_data:
