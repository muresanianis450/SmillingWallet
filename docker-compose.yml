# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml  —  Full local stack (all services in Docker)
#
# Usage:
#   cp .env.example .env        # fill in secrets
#   docker compose up --build   # first time
#   docker compose up           # subsequent runs
#   docker compose down -v      # stop + wipe volumes
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       smilingwallet
      POSTGRES_USER:     ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"            # expose so you can connect with pgAdmin locally
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d smilingwallet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/smilingwallet
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_REDIS_HOST:          redis
      SPRING_REDIS_PORT:          6379
      SPRING_MAIL_USERNAME:       ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD:       ${MAIL_PASSWORD}
      JWT_SECRET:                 ${JWT_SECRET}
      APP_TOTP_ENCRYPTION_KEY:    ${APP_TOTP_ENCRYPTION_KEY}
      CORS_ALLOWED_ORIGINS:       ${CORS_ALLOWED_ORIGINS:-http://localhost}
    ports:
      - "8080:8080"              # expose for debugging; remove in production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s          # Spring Boot needs time to start

  # ── React Frontend (Nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
