# ─────────────────────────────────────────────────────────────────────────────
# Docker / container profile
# Activated by: SPRING_PROFILES_ACTIVE=docker
#
# What this overrides:
#   - SSL disabled  → TLS is terminated at nginx (or ALB in AWS)
#   - show-sql off  → not needed in production
#   - All secrets come from environment variables
# ─────────────────────────────────────────────────────────────────────────────

server:
  port: 8080
  ssl:
    enabled: false          # TLS terminated upstream (nginx / AWS ALB)

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}

  jpa:
    show-sql: false         # keep logs clean in production

  mail:
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}

jwt:
  secret: ${JWT_SECRET}

totp:
  encryption-key: ${APP_TOTP_ENCRYPTION_KEY}
