# ─── Production profile ──────────────────────────────────────────────────────
# Activated by: SPRING_PROFILES_ACTIVE=prod
# All secrets come from environment variables — never hardcode values here.
# ─────────────────────────────────────────────────────────────────────────────

server:
  # Railway / most cloud platforms terminate TLS at their edge.
  # No self-signed keystore needed; plain HTTP inside the container.
  port: ${PORT:8080}
  ssl:
    enabled: false

spring:
  datasource:
    # Set these from the Railway PostgreSQL plugin variables:
    #   SPRING_DATASOURCE_URL=jdbc:postgresql://$PGHOST:$PGPORT/$PGDATABASE
    #   SPRING_DATASOURCE_USERNAME=$PGUSER
    #   SPRING_DATASOURCE_PASSWORD=$PGPASSWORD
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    defer-datasource-initialization: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false          # never log SQL in prod
    properties:
      hibernate:
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      # Railway Redis plugin provides REDIS_URL as redis://default:pass@host:port
      # Spring Boot 3+ / 4+ accepts the full URL here.
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 200MB      # .dcm / CBCT scans can be large
      max-request-size: 210MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000
  inactivity-timeout-ms: 1800000

totp:
  encryption-key: ${APP_TOTP_ENCRYPTION_KEY}

# ── Cloudflare R2 (S3-compatible object storage for CT scans / X-rays) ─────────
# Optional: blank values are tolerated so the app still boots without R2 (uploads
# then return a clear 422). Set these env vars to enable file attachments.
r2:
  account-id: ${R2_ACCOUNT_ID:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket: ${R2_BUCKET:}
  endpoint: ${R2_ENDPOINT:}
  presign-expiry-minutes: 15

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI:postmessage}

brevo:
  api-key: ${BREVO_API_KEY}

app:
  frontend-url: ${APP_FRONTEND_URL}
  mail:
    from-email: ${MAIL_FROM_EMAIL:muresanianis450@gmail.com}

cors:
  # Comma-separated list — add your Railway frontend URL here via env var.
  # Example: https://smilingwallet-frontend.up.railway.app
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
